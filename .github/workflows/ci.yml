name: CI

on:
  pull_request:
    branches: [ci]
  workflow_dispatch:

jobs:
  build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Build (compile)
        run: |
          mkdir -p out
          find src -name "*.java" > sources.txt
          javac -Xlint:all -encoding UTF-8 -d out @sources.txt